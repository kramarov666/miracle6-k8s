apiVersion: v1
kind: Pod
metadata:
  name: miracle6-pvc-consumer
  namespace: miracle6
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      volumeMounts:
        - name: miracle6-storage
          mountPath: /usr/share/nginx/html/data
  volumes:
    - name: miracle6-storage
      persistentVolumeClaim:
        claimName: miracle6-data
