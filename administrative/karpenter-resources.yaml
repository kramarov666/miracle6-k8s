apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: free-tier
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  template:
    metadata:
      labels:
        karpenter-node: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: free-tier
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.micro
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
      taints:
        - key: KarpenterNodePool
          value: "true"
          effect: NoSchedule
  limits:
    cpu: "20"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: free-tier
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KarpenterNodeRole-micro-prod-eks
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: micro-prod-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: micro-prod-eks
