---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: alert-manager-secret-store
    kind: SecretStore

  target:
    name: slack-webhook
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    - secretKey: url
      remoteRef:
        key: ai-investigator/slack-webhook
        property: url