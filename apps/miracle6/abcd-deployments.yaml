
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-a
  namespace: miracle6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-a
  template:
    metadata:
      labels:
        app: ping-a
    spec:
      containers:
        - name: a
          image: kramarov555/abcd-project-a:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kafka-ping-config
