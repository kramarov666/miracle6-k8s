
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-ai-investigator-credentials
  namespace: ai-investigator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: ai-investigator-secret-store
    kind: SecretStore

  target:
    name: elasticsearch-ai-investigator-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth

  data:
    - secretKey: username
      remoteRef:
        key: monitoring/elasticsearch
        property: username

    - secretKey: password
      remoteRef:
        key: monitoring/elasticsearch
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: ai-investigator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: ai-investigator-secret-store
    kind: SecretStore

  target:
    name: slack-webhook
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    - secretKey: url
      remoteRef:
        key: ai-investigator/slack-webhook
        property: url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-investigator-openai
  namespace: ai-investigator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: ai-investigator-secret-store
    kind: SecretStore

  target:
    name: ai-investigator-openai
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ai-investigator/openai_api_key
        property: OPENAI_API_KEY