apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ai-investigator-secret-store
  namespace: ai-investigator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "ai-investigator"
          serviceAccountRef:
            name: ai-investigator
            audiences:
              - vault