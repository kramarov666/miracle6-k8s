# Watch only the application namespace for a small test installation.
watchNamespaces:
  - miracle6
watchAnyNamespace: false
replicas: 1
nodeSelector:
  karpenter-node: "true"
tolerations:
  - key: KarpenterNodePool
    operator: Equal
    value: "true"
    effect: NoSchedule
logLevel: DEBUG
operationTimeoutMs: 600000
extraEnvs:
  - name: KUBERNETES_REQUEST_TIMEOUT
    value: '60000'
