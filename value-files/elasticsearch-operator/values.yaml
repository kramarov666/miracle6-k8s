managedNamespaces:
  - monitoring

nodeSelector:
  karpenter-node: "true"

tolerations:
  - key: KarpenterNodePool
    operator: Equal
    value: "true"
    effect: NoSchedule

resources:
  limits:
    cpu: 1
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 150Mi

webhook:
  enabled: true

telemetry:
  disabled: false