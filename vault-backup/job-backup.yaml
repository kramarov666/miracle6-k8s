apiVersion: batch/v1
kind: Job
metadata:
  name: vault-backup
  namespace: vault
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        name: system-node
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vault-backup
          image: kramarov555/vault-backup-recovery:v0.0.2
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: backup
            - name: S3_BUCKET
              value: prod-vault-backups-326130805573-us-east-1
            - name: CONSUL_HTTP_ADDR
              value: consul-consul-server.consul.svc.cluster.local:8500
            - name: AWS_REGION
              value: us-east-1
            - name: S3_PREFIX
              value: vault-snapshots
            - name: S3_SSE
              value: AES256
